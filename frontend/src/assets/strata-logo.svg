<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">STRATA — Sistem Informasi Akademik Terpadu</title>
  <desc id="desc">Logo modern profesional berwarna hijau emerald dengan simbol lapisan data dan buku akademik.</desc>
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="1" stop-color="#022C22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#064E3B" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Emblem -->
  <g transform="translate(54 44)" filter="url(#shadow)">
    <rect width="332" height="332" rx="76" fill="url(#deep)"/>
    <rect x="18" y="18" width="296" height="296" rx="62" fill="none" stroke="#34D399" stroke-opacity=".22" stroke-width="2"/>
    <!-- layered academic mark -->
    <path d="M72 122 166 75l94 47-94 47-94-47Z" fill="url(#emerald)"/>
    <path d="m72 122 94 47 94-47v27l-94 48-94-48v-27Z" fill="#059669"/>
    <path d="M93 172v52c0 0 31 32 73 32s73-32 73-32v-52l-73 37-73-37Z" fill="#A7F3D0" fill-opacity=".96"/>
    <path d="M166 169v87" stroke="#064E3B" stroke-width="9" stroke-linecap="round"/>
    <circle cx="166" cy="266" r="9" fill="#34D399"/>
    <!-- small signal dots -->
    <circle cx="88" cy="87" r="5" fill="#6EE7B7" fill-opacity=".8"/>
    <circle cx="244" cy="87" r="5" fill="#6EE7B7" fill-opacity=".8"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(450 116)">
    <text x="0" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="126" font-weight="800" letter-spacing="8" fill="#064E3B">STRATA</text>
    <rect x="4" y="148" width="560" height="5" rx="2.5" fill="url(#emerald)"/>
    <text x="4" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" letter-spacing="2.4" fill="#047857">SISTEM INFORMASI AKADEMIK TERPADU</text>
    <text x="4" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" letter-spacing="1.5" fill="#6B7280">TERSTRUKTUR · TERINTEGRASI · TERPERCAYA</text>
  </g>
</svg>
